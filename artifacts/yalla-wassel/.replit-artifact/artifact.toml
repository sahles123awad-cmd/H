kind = "web"
previewPath = "/"
title = "يلا وصل — Yalla Wassel"
version = "1.0.0"
id = "artifacts/yalla-wassel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18921

[services.development]
run = "pnpm --filter @workspace/yalla-wassel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yalla-wassel", "run", "build" ]
publicDir = "artifacts/yalla-wassel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18921"
BASE_PATH = "/"
